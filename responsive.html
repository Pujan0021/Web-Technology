<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      h1 {
        font-size: 1.5rem;
        background-color: black;
        color: white;
        text-align: center;
        border-radius: 1.5rem;
        padding: 3rem;
      }
      .flex {
        display: flex;
        justify-content: center;
      }
      p {
        font-size: 1.5rem;
        background-color: black;
        padding: 40px;
        color: white;
        text-align: center;
        border-radius: 20px;
      }
      img {
        height: 300px;
        width: 300px;
        border-radius: 2rem;
      }
      @media (min-width: 576px) {
        h1 {
          font-size: 4rem;
        }
        p {
          font-size: 2.5rem;
        }
        img {
          height: 500px;
          width: 500px;
          border-radius: 2rem;
        }
      }
    </style>
  </head>
  <body>
    <h1>Responsive Design Example</h1>
    <p>This is a responsive design.</p>
    <div class="flex">
      <img src="./kedarnath.jpg" alt="kedarnath" />
    </div>
  </body>
</html>
